app:
  app_name: "StarPDF"
  app_version: "2.5"
  default_theme: System
  default_color_theme: blue
  icon_sun: assets/icons/sun.png
  icon_moon: assets/icons/moon.png
  app_icon: assets/app_icon.ico

normas_predefinidas:
  - Durante la presentación inicial, los participantes deben mantenerse en silencio,
    salvo que se les pida intervenir.
  - Para abrir un debate sobre cualquier tema, se deberá presentar previamente una propuesta
    concreta.
  - El debate formal se realizará únicamente en el punto designado como 'Debate abierto
    sobre los puntos'.
  - El rol del moderador debe ser ejemplar, manteniendo la formalidad y gestionando
    las solicitudes de palabra.

pdf_design:
  logo_path: assets/logo.png
  company_name: STAR Software | star-software.net

listas_predefinidas:
  proyectos:
