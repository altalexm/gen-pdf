[project]
name = "gen-pdf"
version = "0.1.0"
description = "Open-source visual PDF document editor: edit everything inline, drag blocks in the preview, export to PDF."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "jinja2>=3.1",
  "fpdf2==2.8.4",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` (as in CI) does not add the repo root to sys.path the way
# `python -m pytest` does. Declare it explicitly (pytest>=7).
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
